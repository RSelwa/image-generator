name: 🐳 Cloud Build
description:
  Authenticate to Google Cloud, submit a Cloud Build config and wait for the
  build to finish. Fails when the build does not end in SUCCESS.

inputs:
  config:
    description: Path to the cloudbuild.yaml to submit.
    required: true
  project_id:
    description: Google Cloud project id.
    required: true
  credentials_json:
    description: Service account key used to authenticate.
    required: true

runs:
  using: composite
  steps:
    - name: 🔐 Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.credentials_json }}

    - name: ⚙️ Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: 🐳 Build and push Docker image
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        PROJECT_ID: ${{ inputs.project_id }}
      run: |
        set -euo pipefail
        BUILD_ID=$(gcloud builds submit \
          --config "$CONFIG" \
          --project "$PROJECT_ID" \
          --async \
          --format='value(id)')
        echo "Build submitted: $BUILD_ID"
        while true; do
          STATUS=$(gcloud builds describe "$BUILD_ID" \
            --project "$PROJECT_ID" \
            --format='value(status)')
          echo "Build status: $STATUS"
          case "$STATUS" in
            SUCCESS) exit 0 ;;
            FAILURE | INTERNAL_ERROR | TIMEOUT | CANCELLED | EXPIRED) exit 1 ;;
          esac
          sleep 10
        done
