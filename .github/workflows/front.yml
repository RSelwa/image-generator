name: 🧪 Front
run-name: 🧪 Front

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: front-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  init:
    runs-on: ubuntu-latest
    name: ⚙️ Cache Playwright browsers
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    steps:
      - name: ✨ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Initialize Node.js Environment
        uses: ./.github/actions/initialization

      - name: 🔍 Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @repo/front exec playwright --version | tail -1)" >> "$GITHUB_OUTPUT"

      - name: 📦 Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}

      - name: 🎭 Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/front exec playwright install --with-deps chromium

  unit:
    runs-on: ubuntu-latest
    name: 🧪 Unit Tests
    steps:
      - name: ✨ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Initialize Node.js Environment
        uses: ./.github/actions/initialization

      - name: 💾 Turbo Cache
        uses: ./.github/actions/turbo-cache

      - name: 📦 Build libs
        run: pnpm build:libs

      - name: 🧪 Run unit tests
        run: pnpm --filter @repo/front test:unit

  e2e:
    needs: init
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip_e2e]') }}
    name: 🧪 E2E Tests - ${{ matrix.suite }}
    environment: prod
    strategy:
      matrix:
        include:
          - suite: auth
            path: auth
          - suite: demo
            path: demo
          - suite: lobby
            path: lobby/
          - suite: lobby-playing
            path: lobby-playing
          - suite: daily-challenge
            path: daily-challenge
          - suite: race
            path: race
          - suite: achievements
            path: achievements
      fail-fast: false
    steps:
      - name: ✨ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Initialize Node.js Environment
        uses: ./.github/actions/initialization

      - name: 📦 Restore Playwright browsers cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ needs.init.outputs.playwright-version }}

      - name: 🎭 Install Playwright system dependencies
        run: pnpm --filter @repo/front exec playwright install-deps chromium

      - name: 📦 Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase.json') }}

      - name: 💾 Turbo Cache
        uses: ./.github/actions/turbo-cache

      - name: 📦 Build libs
        run: pnpm build:libs

      - name: 📦 Build functions
        run: pnpm build:cf

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🧪 Run E2E Tests - ${{ matrix.suite }}
        run: pnpm exec firebase emulators:exec --project "$GCLOUD_PROJECT" 'pnpm --filter @repo/front e2e -- e2e/${{ matrix.path }}'
        env:
          GCLOUD_PROJECT: ${{ secrets.PROJECT_ID }}

      - name: 📊 Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.suite }}
          path: apps/front/playwright-report/
          retention-days: 30

  e2e-complete:
    needs: e2e
    runs-on: ubuntu-latest
    name: ✅ E2E Tests Complete
    if: ${{ always() }}
    steps:
      - name: ❌ Some E2E tests failed
        if: ${{ needs.e2e.result != 'success' && needs.e2e.result != 'skipped' }}
        run: exit 1

      - name: ✅ All E2E tests passed or skipped
        run: echo "E2E passed or skipped"

  deploy:
    needs: [unit, e2e-complete]
    runs-on: ubuntu-latest
    name: 🚀 Deploy to VPS
    concurrency:
      group: vps-${{ github.ref_name }}
      cancel-in-progress: false
    if: >-
      github.ref_name == 'main' || github.ref_name == 'develop'
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: ✨ Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy
        uses: ./.github/actions/deploy
        with:
          environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          branch: ${{ github.ref_name }}
          vps_host: ${{ secrets.VPS_HOST }}
          vps_user: ${{ secrets.VPS_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
